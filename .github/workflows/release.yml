name: Release

# Builds the extension ZIP from the tagged source and attaches it to the
# GitHub Release of that tag. Runs when a `v*` tag is pushed. To rebuild the
# ZIP of an existing release, run the workflow manually and give the tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to its release (for example v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  package:
    name: Build and attach the extension ZIP
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json pins the build tools as git+ssh URLs; the runner has no SSH key.
      - name: Fetch GitHub dependencies over HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: npm ci --allow-git=all

      - name: Check that the tag matches the extension version
        run: |
          VERSION="$(jq -r .version extension.json)"
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match extension.json version ${VERSION}" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build the extension ZIP
        run: |
          npm run extension
          test -f "build/team-board-${VERSION}.zip"
          sha256sum "build/team-board-${VERSION}.zip" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Attach the ZIP to the release
        run: |
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --verify-tag --title "MC Team Board ${VERSION}" --generate-notes
          fi
          gh release upload "${TAG}" "build/team-board-${VERSION}.zip" --clobber
